[project]
name = "impact-evidence-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-monitor-opentelemetry>=1.8.12",
    "azure-search-documents>=12.1.0",
    "azure-storage-blob>=12.31.1",
    "httpx>=0.28.1",
    "mcp<2",
    "msal>=1.39.0",
    "msgraph-sdk>=1.65.0",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "msal>=1.39.0",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]


[tool.pytest.ini_options]
pythonpath = ["mcp_server/src", "."]
testpaths = ["mcp_server/tests"]
asyncio_default_fixture_loop_scope = "function"
