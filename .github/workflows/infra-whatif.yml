name: Infra what-if (dev)

on:
  workflow_dispatch:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read

jobs:
  whatif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Compare Bicep with what is deployed (changes nothing)
        run: |
          az deployment group what-if -g rg-iea-dev \
            --template-file infra/main.bicep --parameters infra/dev.bicepparam \
            --result-format ResourceIdOnly
